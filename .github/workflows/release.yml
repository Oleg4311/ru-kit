name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Версия в package.json должна совпадать с тегом
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/pack-smoke.mjs
      - name: Сборка tarball
        run: |
          mkdir dist-pack
          npm pack --pack-destination dist-pack
          (cd dist-pack && sha256sum *.tgz > SHA256SUMS)
      - name: Подтверждение происхождения (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist-pack/*.tgz
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist-pack/*.tgz dist-pack/SHA256SUMS
          --title "ru-kit $GITHUB_REF_NAME"
          --notes "Пакет ru-kit (tarball). Установка: npm install https://github.com/Oleg4311/ru-kit/releases/download/$GITHUB_REF_NAME/oleg4311-ru-kit-${GITHUB_REF_NAME#v}.tgz. Проверка: sha256sum -c SHA256SUMS и gh attestation verify <файл> --repo Oleg4311/ru-kit."
      # Публикация в npm по доверенной публикации (OIDC): без токенов, с подтверждением происхождения.
      # Идёт последней: если npm недоступен, релиз GitHub уже выпущен.
      - name: Публикация в npm
        run: npm publish
